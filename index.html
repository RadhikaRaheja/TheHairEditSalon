const CAT_LABELS = {
  cleanups: "Clean-ups",
  facials: "Facials",
  luxury: "Luxury Facials (with Moulding Mask)",
  skinora: "Facial Treatments — Skinora"
};

function scoreTreatment(t, skin, concerns, occasion, allergies) {
  if (allergies.size > 0) {
    for (const a of allergies) {
      if (t.allergies.includes(a)) return null;
    }
  }
  if (skin && !t.skins.includes(skin)) return null;

  let score = 0;
  if (skin && t.skins.includes(skin)) score += 2;
  if (occasion && t.occasions.includes(occasion)) score += 2;

  for (const c of concerns) {
    if (t.concerns.includes(c)) score += 3;
    if (t.boost.includes(c)) score += 2;
  }

  if (occasion === "bridal" && t.boost.includes("bridal")) score += 5;
  if (occasion === "event" && t.boost.includes("glow")) score += 2;
  if (occasion === "first" && t.skins.includes("sensitive")) score += 1;

  return score;
}

document.querySelectorAll('.chip').forEach(btn => {
  btn.addEventListener('click', () => {
    const group = btn.dataset.group;
    const val = btn.dataset.val;

    if (group === 'skin' || group === 'occasion') {
      document.querySelectorAll(`.chip[data-group="${group}"]`).forEach(b => b.classList.remove('selected'));
      btn.classList.toggle('selected');
      state[group] = btn.classList.contains('selected') ? val : null;
    } else if (group === 'concern') {
      btn.classList.toggle('selected');
      if (btn.classList.contains('selected')) state.concerns.add(val);
      else state.concerns.delete(val);
    } else if (group === 'allergy') {
      btn.classList.toggle('selected');
      btn.classList.toggle('allergy-selected');
      if (btn.classList.contains('allergy-selected')) state.allergies.add(val);
      else state.allergies.delete(val);
    }
  });
});

document.getElementById('find-btn').addEventListener('click', () => {
  const { skin, concerns, occasion, allergies } = state;
  if (!skin && concerns.size === 0) {
    alert('Please select at least your skin type or a concern to get recommendations.');
    return;
  }

  const content = document.getElementById('results-content');
  content.innerHTML = '';

  let totalFound = 0;

  for (const [cat, treatments] of Object.entries(TREATMENTS)) {
    const scored = treatments
      .map(t => ({ t, score: scoreTreatment(t, skin, concerns, occasion, allergies) }))
      .filter(x => x.score !== null && x.score > 0)
      .sort((a, b) => b.score - a.score);

    if (scored.length === 0) continue;
    totalFound += scored.length;

    const block = document.createElement('div');
    block.className = 'category-block';
    block.innerHTML = `<div class="cat-label">${CAT_LABELS[cat]}</div>`;

    scored.forEach(({ t, score }, i) => {
      const card = document.createElement('div');
      card.className = 'treatment-card' + (i === 0 && score > 4 ? ' top-pick' : '');
      const badgeHtml = i === 0 && score > 4
        ? `<span class="badge badge-top">Best match</span><br>`
        : score > 2 ? `<span class="badge badge-good">Good match</span><br>` : '';

      card.innerHTML = `
        <div class="tc-icon">${t.icon}</div>
        <div class="tc-body">
          ${badgeHtml}
          <div class="tc-name">${t.name}</div>
          <div class="tc-why">${t.desc}</div>
          ${t.note ? `<div class="tc-why" style="margin-top:4px; font-style:italic;">${t.note}</div>` : ''}
        </div>
      `;
      block.appendChild(card);
    });

    content.appendChild(block);
  }

  const sub = [];
  if (skin) sub.push(skin.replace('_',' ') + ' skin');
  if (concerns.size > 0) sub.push([...concerns].join(', ').replace(/_/g,' '));
  document.getElementById('results-sub').textContent = `Based on: ${sub.join(' · ')}${allergies.size > 0 ? ' — allergies excluded' : ''}`;

  if (totalFound === 0) {
    content.innerHTML = '<div class="no-results">No treatments matched your profile. Try adjusting your selections or speak with our team for a personalised consultation.</div>';
  }

  document.getElementById('form-area').style.display = 'none';
  const rw = document.getElementById('results-wrap');
  rw.classList.add('visible');
  rw.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

document.getElementById('reset-btn').addEventListener('click', () => {
  state.skin = null;
  state.concerns.clear();
  state.occasion = null;
  state.allergies.clear();
  document.querySelectorAll('.chip').forEach(b => { b.classList.remove('selected','allergy-selected'); });
  document.getElementById('results-wrap').classList.remove('visible');
  document.getElementById('form-area').style.display = 'block';
});
</script>
</body></html>
